name: Build releases

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate version and release notes
        if: github.ref == 'refs/heads/main'
        run: node scripts/check-release.mjs
      - name: Read version
        id: release
        run: node -e "console.log('version=' + require('./package.json').version)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: linux
          - name: Windows
            os: windows-latest
            target: win
          - name: macOS
            os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Install RPM build tools
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm test
      - name: Build native TMDB credential helper
        run: npm run build:tmdb-helper -- ${{ matrix.target }}
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      - name: Verify native TMDB helper
        shell: bash
        run: |
          test -f "native-helper-dist/tmdb-helper${{ matrix.target == 'win' && '.exe' || '' }}"
          if grep -aFq "$TMDB_ACCESS_TOKEN" "native-helper-dist/tmdb-helper${{ matrix.target == 'win' && '.exe' || '' }}"; then
            echo "The native helper contains the plaintext TMDB token." >&2
            exit 1
          fi
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      - name: Package ${{ matrix.name }}
        run: npm run package -- --${{ matrix.target }} --publish never
      - name: Create USB-portable Linux bundle
        if: matrix.target == 'linux'
        run: node scripts/package-linux-portable.mjs
      - name: Attest release artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/*.dmg
            release/*.zip
            release/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: media-renamer-${{ matrix.target }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.ref == 'refs/heads/main'
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract release notes
        run: node scripts/release-notes.mjs "${{ needs.validate.outputs.version }}" /tmp/release-notes.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: node scripts/generate-checksums.mjs artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Media Renamer v${{ needs.validate.outputs.version }}
          body_path: /tmp/release-notes.md
          files: artifacts/*
          fail_on_unmatched_files: true
